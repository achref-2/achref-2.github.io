<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, Achraf Aroua</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23000'/%3E%3Cpath d='M16 16h11' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100svh; display: grid; grid-template-rows: 1fr auto; background: #f2f3f5; color: #000; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.6; }
.field { position: relative; background: #d3d7dc; background-image: linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px); background-size: 64px 64px; overflow: hidden; min-height: 46svh; }
.seen { position: absolute; left: 50%; top: 55%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; background: radial-gradient(circle, #f2f3f5 62%, rgba(242,243,245,0) 64%); }
.bot { position: absolute; left: 50%; top: 55%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #000; }
.bot::after { content: ""; position: absolute; left: 9px; top: 7.8px; width: 7px; height: 2.4px; border-radius: 2px; background: #f2f3f5; transform-origin: 0 50%; animation: look 4s ease-in-out infinite; }
@keyframes look { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-140deg); } 60% { transform: rotate(120deg); } }
.text { max-width: 1240px; width: 100%; margin: 0 auto; padding: 48px clamp(20px, 4vw, 40px) 72px; }
h1 { font-stretch: 125%; font-weight: 800; font-size: clamp(30px, 4.6vw, 56px); line-height: 1.05; letter-spacing: -.02em; max-width: 18ch; }
p { margin-top: 16px; color: #33383e; max-width: 46ch; }
a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; margin-top: 28px; border-radius: 6px; background: #000; color: #f2f3f5; font-weight: 600; text-decoration: none; }
a:hover { background: #2436f0; }
a:focus-visible { outline: 2px solid #2436f0; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .bot::after { animation: none; } }
</style>
</head>
<body>
<div class="field" aria-hidden="true"><div class="seen"></div><div class="bot"></div></div>
<main class="text">
  <h1 id="h">This part of the map is still unexplored.</h1>
  <p id="p">The page you were looking for doesn't exist, or it has moved.</p>
  <a href="/" id="a">Go to the homepage</a>
</main>
<script>
let pref = "";
try { pref = localStorage.getItem("lang") || ""; } catch (e) {}
if ((pref || navigator.language || "").toLowerCase().startsWith("de")) {
  document.documentElement.lang = "de";
  document.getElementById("h").textContent = "Dieser Teil der Karte ist noch unerforscht.";
  document.getElementById("p").textContent = "Die gesuchte Seite gibt es nicht oder sie ist umgezogen.";
  document.getElementById("a").textContent = "Zur Startseite";
}
</script>
</body>
</html>
